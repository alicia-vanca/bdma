name: Build and Release

on:
  push:
    branches:
      - develop
      - release

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    env:
      BDMA_SIGNING_CERT_THUMBPRINT: ${{ vars.BDMA_SIGNING_CERT_THUMBPRINT }}
      BDMA_TIMESTAMP_URL: http://timestamp.digicert.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download JavaFX JMODs
        run: |
          $javafxUrl = "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip"
          $javafxArchive = "javafx-jmods.zip"
          $maxDownloadAttempts = 4
          $downloadSucceeded = $false

          for ($attempt = 1; $attempt -le $maxDownloadAttempts; $attempt++) {
            Remove-Item -LiteralPath $javafxArchive -Force -ErrorAction SilentlyContinue
            Write-Host "Downloading JavaFX JMODs (attempt $attempt of $maxDownloadAttempts)..."

            curl.exe --fail --location --silent --show-error $javafxUrl -o $javafxArchive
            $curlExitCode = $LASTEXITCODE

            if ($curlExitCode -eq 0 -and (Test-Path -LiteralPath $javafxArchive)) {
              $downloadSucceeded = $true
              break
            }

            if ($attempt -lt $maxDownloadAttempts) {
              $retryDelaySeconds = [int][math]::Pow(2, $attempt)
              Write-Warning "JavaFX download attempt $attempt failed with exit code $curlExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $downloadSucceeded) {
            throw "JavaFX JMOD download failed after $maxDownloadAttempts attempts."
          }

          Expand-Archive -LiteralPath $javafxArchive -DestinationPath C:\
          Rename-Item "C:\javafx-jmods-21.0.2" "C:\javafx-jmods"

      - name: Grant Gradle permission
        run: chmod +x gradlew
        shell: bash

      - name: Build shadow JAR
        env:
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
          BODYCAM_CRYPTO_PASSWORD: ${{ secrets.BODYCAM_CRYPTO_PASSWORD }}
          PATCH_MASTER_KEY: ${{ secrets.PATCH_MASTER_KEY }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: ./gradlew clean shadowJar

      - name: Prepare package folder
        run: |
          $jarPath = Get-ChildItem -LiteralPath build\libs -Filter app-*.jar | Select-Object -First 1 -ExpandProperty FullName
          if (-not $jarPath) { throw 'Shadow JAR was not found' }
          New-Item -ItemType Directory -Force -Path build\package | Out-Null
          Copy-Item -LiteralPath $jarPath -Destination build\package
          Copy-Item -LiteralPath src\main\resources\image\logo.ico -Destination build\package
          Copy-Item -LiteralPath vendor\adb -Destination build\package\adb -Recurse
          Copy-Item -LiteralPath vendor\vlc -Destination build\package\vlc -Recurse
      - name: Build app-image
        env:
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
          BODYCAM_CRYPTO_PASSWORD: ${{ secrets.BODYCAM_CRYPTO_PASSWORD }}
          PATCH_MASTER_KEY: ${{ secrets.PATCH_MASTER_KEY }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          APP_UPDATE_GITHUB_TOKEN: ${{ secrets.APP_UPDATE_GITHUB_TOKEN }}
        run: |
          $version = "${{ env.APP_VERSION }}"
          $modulePath = "$env:JAVA_HOME\jmods;C:\javafx-jmods"

          jpackage `
            --type app-image `
            --name BDMA `
            --input build\package `
            --main-jar app-$version.jar `
            --main-class com.app.MainApp `
            --app-version $version `
            --icon build\package\logo.ico `
            --dest build\dist `
            --module-path "$modulePath" `
            --add-modules "javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.web,java.sql,java.logging,java.net.http,jdk.httpserver" `
            --java-options "-DLOGGLY_TOKEN=$env:LOGGLY_TOKEN -DBODYCAM_CRYPTO_PASSWORD=$env:BODYCAM_CRYPTO_PASSWORD -DPATCH_MASTER_KEY=$env:PATCH_MASTER_KEY -DTOTP_SECRET=$env:TOTP_SECRET -DAPP_UPDATE_GITHUB_TOKEN=$env:APP_UPDATE_GITHUB_TOKEN" `
            --jlink-options "--strip-debug --compress=2 --no-header-files --no-man-pages --bind-services"

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) {
            throw 'SignTool was not found. Install the Windows SDK on the runner.'
          }

          Add-Content -Path $env:GITHUB_ENV -Value ('BDMA_SIGNTOOL_PATH=' + $signTool.FullName)
          Write-Host 'SignTool found.'

      - name: Prepare code-signing certificate
        shell: pwsh
        timeout-minutes: 5
        env:
          BDMA_SIGNING_PFX_BASE64: ${{ secrets.BDMA_SIGNING_PFX_BASE64 }}
          BDMA_SIGNING_PFX_PASSWORD: ${{ secrets.BDMA_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BDMA_SIGNING_PFX_BASE64)) {
            throw 'Missing GitHub secret: BDMA_SIGNING_PFX_BASE64'
          }

          if ([string]::IsNullOrWhiteSpace($env:BDMA_SIGNING_PFX_PASSWORD)) {
            throw 'Missing GitHub secret: BDMA_SIGNING_PFX_PASSWORD'
          }

          if ([string]::IsNullOrWhiteSpace($env:BDMA_SIGNING_CERT_THUMBPRINT)) {
            throw 'Missing GitHub variable: BDMA_SIGNING_CERT_THUMBPRINT'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'bdma-code-signing.pfx'

          try {
            $pfxBytes = [Convert]::FromBase64String($env:BDMA_SIGNING_PFX_BASE64)
          } catch {
            throw 'BDMA_SIGNING_PFX_BASE64 is not valid Base64.'
          }

          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          Write-Host 'Loading PFX into memory without importing its private key into Windows...'
          $keyStorageFlags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $importedCertificates = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()

          try {
            $importedCertificates.Import($pfxBytes, $env:BDMA_SIGNING_PFX_PASSWORD, $keyStorageFlags)
          } catch {
            throw ('Unable to load code-signing PFX: ' + $_.Exception.Message)
          }

          Write-Host 'PFX loaded in memory.'

          $expectedThumbprint = $env:BDMA_SIGNING_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          $certificate = $importedCertificates |
            Where-Object { $_.Thumbprint -eq $expectedThumbprint } |
            Select-Object -First 1

          if (-not $certificate) {
            throw ('The PFX does not contain the expected certificate: ' + $expectedThumbprint)
          }

          if (-not $certificate.HasPrivateKey) {
            throw 'The imported code-signing certificate does not contain a private key.'
          }

          $rawEnhancedKeyUsageExtension = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            Select-Object -First 1

          if (-not $rawEnhancedKeyUsageExtension) {
            throw 'The imported certificate does not contain an Enhanced Key Usage extension.'
          }

          $enhancedKeyUsageExtension = [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new()
          $enhancedKeyUsageExtension.CopyFrom($rawEnhancedKeyUsageExtension)
          $enhancedKeyUsageOids = @(
            $enhancedKeyUsageExtension.EnhancedKeyUsages |
              ForEach-Object { $_.Value }
          )

          if ($enhancedKeyUsageOids -notcontains '1.3.6.1.5.5.7.3.3') {
            throw 'The imported certificate is not valid for Code Signing.'
          }

          $utcNow = [DateTime]::UtcNow
          $notBefore = $certificate.NotBefore.ToUniversalTime()
          $notAfter = $certificate.NotAfter.ToUniversalTime()

          if ($notBefore -gt $utcNow) {
            throw ('The code-signing certificate is not valid before ' + $notBefore.ToString('O'))
          }

          if ($notAfter -le $utcNow) {
            throw ('The code-signing certificate expired at ' + $notAfter.ToString('O'))
          }

          if ($notAfter -le $utcNow.AddDays(30)) {
            Write-Warning ('The code-signing certificate expires soon: ' + $notAfter.ToString('O'))
          }

          $isSelfSigned = [Convert]::ToBase64String($certificate.SubjectName.RawData) -eq
            [Convert]::ToBase64String($certificate.IssuerName.RawData)

          if ($env:GITHUB_REF_NAME -eq 'release' -and $isSelfSigned) {
            Write-Warning 'Release uses a self-signed certificate. External Windows devices will not trust this publisher automatically.'
          }

          Add-Content -Path $env:GITHUB_ENV -Value ('BDMA_SIGNING_PFX_PATH=' + $pfxPath)
          Add-Content -Path $env:GITHUB_ENV -Value ('BDMA_SIGNING_CERT_SELF_SIGNED=' + $isSelfSigned.ToString().ToLowerInvariant())

          Write-Host ('Code-signing PFX validated: ' + $certificate.Subject)
          Write-Host ('Thumbprint: ' + $certificate.Thumbprint)
          Write-Host ('Valid until: ' + $notAfter.ToString('O'))
          Write-Host ('Self-signed: ' + $isSelfSigned)

      - name: Sign and verify BDMA launcher
        shell: pwsh
        timeout-minutes: 5
        env:
          BDMA_SIGNING_PFX_PASSWORD: ${{ secrets.BDMA_SIGNING_PFX_PASSWORD }}
        run: |
          $launcherPath = Join-Path (Get-Location).Path 'build\dist\BDMA\BDMA.exe'

          if (-not (Test-Path $launcherPath)) {
            throw ('BDMA launcher not found: ' + $launcherPath)
          }

          if (-not (Test-Path $env:BDMA_SIGNTOOL_PATH)) {
            throw ('SignTool path is unavailable: ' + $env:BDMA_SIGNTOOL_PATH)
          }

          if (-not (Test-Path $env:BDMA_SIGNING_PFX_PATH)) {
            throw ('Code-signing PFX path is unavailable: ' + $env:BDMA_SIGNING_PFX_PATH)
          }

          if ([string]::IsNullOrWhiteSpace($env:BDMA_SIGNING_PFX_PASSWORD)) {
            throw 'Missing GitHub secret: BDMA_SIGNING_PFX_PASSWORD'
          }

          $expectedThumbprint = $env:BDMA_SIGNING_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()

          (Get-Item $launcherPath).IsReadOnly = $false

          & $env:BDMA_SIGNTOOL_PATH sign /f $env:BDMA_SIGNING_PFX_PATH /p $env:BDMA_SIGNING_PFX_PASSWORD /fd SHA256 /d BDMA /v $launcherPath

          if ($LASTEXITCODE -ne 0) {
            throw ('BDMA launcher signing failed with exit code ' + $LASTEXITCODE)
          }

          $maxTimestampAttempts = 4
          $timestampSucceeded = $false

          for ($attempt = 1; $attempt -le $maxTimestampAttempts; $attempt++) {
            & $env:BDMA_SIGNTOOL_PATH timestamp /tr $env:BDMA_TIMESTAMP_URL /td SHA256 /v $launcherPath

            if ($LASTEXITCODE -eq 0) {
              $timestampSucceeded = $true
              break
            }

            if ($attempt -lt $maxTimestampAttempts) {
              $retryDelaySeconds = [int](5 * [math]::Pow(2, $attempt - 1))
              Write-Warning ('Launcher timestamp attempt failed. Retrying in ' + $retryDelaySeconds + ' seconds.')
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $timestampSucceeded) {
            throw ('BDMA launcher timestamping failed after ' + $maxTimestampAttempts + ' attempts.')
          }

          $isSelfSigned = $env:BDMA_SIGNING_CERT_SELF_SIGNED -eq 'true'

          if (-not $isSelfSigned) {
            & $env:BDMA_SIGNTOOL_PATH verify /pa /all /tw /v $launcherPath

            if ($LASTEXITCODE -ne 0) {
              throw ('BDMA launcher signature verification failed with exit code ' + $LASTEXITCODE)
            }
          }

          $signature = Get-AuthenticodeSignature $launcherPath
          $signatureStatus = $signature.Status.ToString()
          $hasExpectedSelfSignedStatus = $signatureStatus -in @('Valid', 'NotTrusted', 'UnknownError')

          if ($isSelfSigned) {
            if (-not $hasExpectedSelfSignedStatus) {
              throw ('BDMA launcher self-signed signature verification failed: ' + $signature.StatusMessage)
            }
          } elseif ($signatureStatus -ne 'Valid') {
            throw ('BDMA launcher signature is not trusted: ' + $signature.StatusMessage)
          }

          if (-not $signature.TimeStamperCertificate) {
            throw 'BDMA launcher does not contain a trusted timestamp.'
          }

          if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
            throw ('BDMA launcher was signed by unexpected certificate: ' + $signature.SignerCertificate.Thumbprint)
          }

          Write-Host ('BDMA launcher timestamp verified: ' + $signature.TimeStamperCertificate.Subject)

      - name: Install NSIS
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          $maxInstallAttempts = 4
          $installSucceeded = $false

          for ($attempt = 1; $attempt -le $maxInstallAttempts; $attempt++) {
            Write-Host "Installing NSIS (attempt $attempt of $maxInstallAttempts)..."

            choco install nsis -y --no-progress
            $chocoExitCode = $LASTEXITCODE

            if ($chocoExitCode -eq 0 -and (Test-Path $nsisPath)) {
              $installSucceeded = $true
              break
            }

            if ($attempt -lt $maxInstallAttempts) {
              $retryDelaySeconds = [int](5 * [math]::Pow(2, $attempt))
              Write-Warning "NSIS installation attempt $attempt failed with exit code $chocoExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $installSucceeded) {
            throw "NSIS installation failed after $maxInstallAttempts attempts. Expected executable not found: $nsisPath"
          }

          Write-Host "NSIS installation verified: $nsisPath"

      - name: Build NSIS installer
        run: |
          $version = "${{ env.APP_VERSION }}"
          $outputDir = Join-Path (Get-Location).Path "build\installer"
          $sourceDir = Join-Path (Get-Location).Path "build\dist\BDMA"
          $iconPath = Join-Path (Get-Location).Path "src\main\resources\image\logo.ico"
          $appPathsSource = Get-Content "src\main\java\com\app\common\definitions\AppDataPaths.java" -Raw
          $appDirMatch = [regex]::Match($appPathsSource, 'APP_DIR\s*=\s*(?:Path\.of\(\s*System\.getProperty\("user\.home"\)\s*,\s*(?<pathOfSuffixExpression>.*?)\)\s*\.toString\(\)|System\.getProperty\("user\.home"\)\s*\+\s*(?<concatSuffixExpression>.*?));', [System.Text.RegularExpressions.RegexOptions]::Singleline)

          if (-not $appDirMatch.Success) {
            throw "Could not extract APP_DIR from AppDataPaths.java"
          }

          $isPathOfExpression = $appDirMatch.Groups['pathOfSuffixExpression'].Success
          $pathSeparator = [IO.Path]::DirectorySeparatorChar
          $suffixExpression = if ($isPathOfExpression) {
            $appDirMatch.Groups['pathOfSuffixExpression'].Value
          } else {
            $appDirMatch.Groups['concatSuffixExpression'].Value
          }

          $suffixParts = [regex]::Matches($suffixExpression, '"([^"]*)"') | ForEach-Object {
            $_.Groups[1].Value.Replace('/', $pathSeparator)
          }

          if ($suffixParts.Count -eq 0) {
            throw "Could not extract APP_DIR suffix from AppDataPaths.java"
          }

          if ($isPathOfExpression) {
            $appDataDir = '$PROFILE' + $pathSeparator + ($suffixParts -join $pathSeparator)
          } else {
            $appDataDir = '$PROFILE' + ($suffixParts -join '')
          }

          New-Item -ItemType Directory -Force -Path build\installer | Out-Null

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /INPUTCHARSET UTF8 `
            "/DAPP_VERSION=$version" `
            "/DINSTALLER_OUTPUT_DIR=$outputDir" `
            "/DINSTALLER_SOURCE_DIR=$sourceDir" `
            "/DINSTALLER_ICON=$iconPath" `
            "/DAPP_DATA_DIR=$appDataDir" `
            src\main\resources\installer\installer.nsi

      - name: Sign and verify NSIS installer
        shell: pwsh
        timeout-minutes: 5
        env:
          BDMA_SIGNING_PFX_PASSWORD: ${{ secrets.BDMA_SIGNING_PFX_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem 'build\installer\*.exe' -File)

          if ($installers.Count -ne 1) {
            throw ('Expected exactly one NSIS installer, found ' + $installers.Count)
          }

          $installerPath = $installers[0].FullName
          (Get-Item $installerPath).IsReadOnly = $false

          if (-not (Test-Path $env:BDMA_SIGNING_PFX_PATH)) {
            throw ('Code-signing PFX path is unavailable: ' + $env:BDMA_SIGNING_PFX_PATH)
          }

          if ([string]::IsNullOrWhiteSpace($env:BDMA_SIGNING_PFX_PASSWORD)) {
            throw 'Missing GitHub secret: BDMA_SIGNING_PFX_PASSWORD'
          }

          $expectedThumbprint = $env:BDMA_SIGNING_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()

          & $env:BDMA_SIGNTOOL_PATH sign /f $env:BDMA_SIGNING_PFX_PATH /p $env:BDMA_SIGNING_PFX_PASSWORD /fd SHA256 /d BDMA /v $installerPath

          if ($LASTEXITCODE -ne 0) {
            throw ('NSIS installer signing failed with exit code ' + $LASTEXITCODE)
          }

          $maxTimestampAttempts = 4
          $timestampSucceeded = $false

          for ($attempt = 1; $attempt -le $maxTimestampAttempts; $attempt++) {
            & $env:BDMA_SIGNTOOL_PATH timestamp /tr $env:BDMA_TIMESTAMP_URL /td SHA256 /v $installerPath

            if ($LASTEXITCODE -eq 0) {
              $timestampSucceeded = $true
              break
            }

            if ($attempt -lt $maxTimestampAttempts) {
              $retryDelaySeconds = [int](5 * [math]::Pow(2, $attempt - 1))
              Write-Warning ('Installer timestamp attempt failed. Retrying in ' + $retryDelaySeconds + ' seconds.')
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $timestampSucceeded) {
            throw ('NSIS installer timestamping failed after ' + $maxTimestampAttempts + ' attempts.')
          }

          $isSelfSigned = $env:BDMA_SIGNING_CERT_SELF_SIGNED -eq 'true'

          if (-not $isSelfSigned) {
            & $env:BDMA_SIGNTOOL_PATH verify /pa /all /tw /v $installerPath

            if ($LASTEXITCODE -ne 0) {
              throw ('NSIS installer signature verification failed with exit code ' + $LASTEXITCODE)
            }
          }

          $signature = Get-AuthenticodeSignature $installerPath
          $signatureStatus = $signature.Status.ToString()
          $hasExpectedSelfSignedStatus = $signatureStatus -in @('Valid', 'NotTrusted', 'UnknownError')

          if ($isSelfSigned) {
            if (-not $hasExpectedSelfSignedStatus) {
              throw ('NSIS installer self-signed signature verification failed: ' + $signature.StatusMessage)
            }
          } elseif ($signatureStatus -ne 'Valid') {
            throw ('NSIS installer signature is not trusted: ' + $signature.StatusMessage)
          }

          if (-not $signature.TimeStamperCertificate) {
            throw 'NSIS installer does not contain a trusted timestamp.'
          }

          if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
            throw ('NSIS installer was signed by unexpected certificate: ' + $signature.SignerCertificate.Thumbprint)
          }

          Write-Host ('NSIS installer timestamp verified: ' + $signature.TimeStamperCertificate.Subject)

      - name: Upload installer to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWS_ACCESS_KEY_ID)) {
            throw "Missing GitHub secret: R2_ACCESS_KEY_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:AWS_SECRET_ACCESS_KEY)) {
            throw "Missing GitHub secret: R2_SECRET_ACCESS_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID)) {
            throw "Missing GitHub secret: R2_ACCOUNT_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:R2_BUCKET_NAME)) {
            throw "Missing GitHub secret: R2_BUCKET_NAME"
          }

          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          if ($env:GITHUB_REF_NAME -eq "develop") {
            $stableObjectKey = "BDMA_dev.exe"
          } elseif ($env:GITHUB_REF_NAME -eq "release") {
            $stableObjectKey = "BDMA.exe"
          } else {
            throw "Unsupported branch for R2 upload: $env:GITHUB_REF_NAME"
          }

          $localFile = Get-ChildItem -LiteralPath "build\installer" -Filter "*.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          $versionedObjectKey = "versions/BDMA-${{ env.APP_VERSION }}-Setup.exe"

          if (-not $localFile) {
            throw "R2 upload file not found in build\installer."
          }

          $localFileLength = (Get-Item -LiteralPath $localFile).Length
          $uploadId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_SHA"

          $maxTransferAttempts = 4
          $uploadSucceeded = $false

          for ($attempt = 1; $attempt -le $maxTransferAttempts; $attempt++) {
            Write-Host "Uploading versioned installer to R2 object key: $versionedObjectKey (attempt $attempt of $maxTransferAttempts)"

            aws s3 cp $localFile "s3://$env:R2_BUCKET_NAME/$versionedObjectKey" `
              --endpoint-url $endpoint `
              --content-type "application/vnd.microsoft.portable-executable" `
              --cache-control "public, max-age=31536000, immutable" `
              --metadata "github-upload-id=$uploadId" `
              --no-progress

            $uploadExitCode = $LASTEXITCODE
            if ($uploadExitCode -eq 0) {
              $uploadSucceeded = $true
              break
            }

            if ($attempt -lt $maxTransferAttempts) {
              $retryDelaySeconds = [int][math]::Pow(2, $attempt)
              Write-Warning "Versioned R2 upload failed with exit code $uploadExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $uploadSucceeded) {
            throw "Versioned R2 upload failed after $maxTransferAttempts attempts: $versionedObjectKey"
          }
          $versionedHeadJson = aws s3api head-object `
            --bucket $env:R2_BUCKET_NAME `
            --key $versionedObjectKey `
            --endpoint-url $endpoint `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Versioned R2 upload verification request failed: $versionedObjectKey"
          }

          $versionedHead = $versionedHeadJson | ConvertFrom-Json
          $versionedUploadId = $versionedHead.Metadata.'github-upload-id'

          if ([int64]$versionedHead.ContentLength -ne $localFileLength) {
            throw "Versioned R2 upload verification failed: remote size $($versionedHead.ContentLength) does not match local size $localFileLength."
          }

          if ($versionedUploadId -ne $uploadId) {
            throw "Versioned R2 upload verification failed: remote upload ID '$versionedUploadId' does not match this workflow run."
          }

          $copySucceeded = $false

          for ($attempt = 1; $attempt -le $maxTransferAttempts; $attempt++) {
            Write-Host "Copying versioned installer to stable R2 object key: $stableObjectKey (attempt $attempt of $maxTransferAttempts)"

            aws s3api copy-object `
              --bucket $env:R2_BUCKET_NAME `
              --copy-source "$env:R2_BUCKET_NAME/$versionedObjectKey" `
              --key $stableObjectKey `
              --metadata-directive REPLACE `
              --content-type "application/vnd.microsoft.portable-executable" `
              --cache-control "no-store, max-age=0, must-revalidate" `
              --metadata "github-upload-id=$uploadId" `
              --endpoint-url $endpoint `
              --output json | Out-Null

            $copyExitCode = $LASTEXITCODE
            if ($copyExitCode -eq 0) {
              $copySucceeded = $true
              break
            }

            if ($attempt -lt $maxTransferAttempts) {
              $retryDelaySeconds = [int][math]::Pow(2, $attempt)
              Write-Warning "R2 stable copy failed with exit code $copyExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $copySucceeded) {
            throw "R2 stable copy failed after $maxTransferAttempts attempts: $versionedObjectKey to $stableObjectKey"
          }
          $stableHeadJson = aws s3api head-object `
            --bucket $env:R2_BUCKET_NAME `
            --key $stableObjectKey `
            --endpoint-url $endpoint `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Stable R2 object verification request failed: $stableObjectKey"
          }

          $stableHead = $stableHeadJson | ConvertFrom-Json
          $stableUploadId = $stableHead.Metadata.'github-upload-id'

          if ([int64]$stableHead.ContentLength -ne $localFileLength) {
            throw "Stable R2 object verification failed: remote size $($stableHead.ContentLength) does not match local size $localFileLength."
          }

          if ($stableUploadId -ne $uploadId) {
            throw "Stable R2 object verification failed: remote upload ID '$stableUploadId' does not match this workflow run."
          }

          Write-Host "R2 upload and stable copy verified successfully ($localFileLength bytes, upload ID $uploadId)."

          $archiveListJson = aws s3api list-objects-v2 `
            --bucket $env:R2_BUCKET_NAME `
            --prefix "versions/BDMA-" `
            --endpoint-url $endpoint `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list versioned R2 installers."
          }

          $archiveList = $archiveListJson | ConvertFrom-Json
          $archives = @($archiveList.Contents) |
            Where-Object { $_.Key -match '^versions/BDMA-[^/]+-Setup\.exe$' } |
            Sort-Object { [DateTimeOffset]$_.LastModified } -Descending
          $expiredArchives = @($archives | Select-Object -Skip 10)

          foreach ($archive in $expiredArchives) {
            Write-Host "Deleting expired versioned installer: $($archive.Key)"
            aws s3api delete-object `
              --bucket $env:R2_BUCKET_NAME `
              --key $archive.Key `
              --endpoint-url $endpoint | Out-Null

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete expired versioned installer: $($archive.Key)"
            }
          }

          Write-Host "Versioned installer retention complete: kept $($archives.Count - $expiredArchives.Count), deleted $($expiredArchives.Count)."

      - name: Package source code
        run: git archive --format=zip --output="build\BDMA-${{ env.APP_VERSION }}-source.zip" HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDMA-${{ env.APP_VERSION }}-source
          path: build/BDMA-${{ env.APP_VERSION }}-source.zip
          retention-days: 7

      - name: Upload Release Asset
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/installer/*.exe
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup code-signing material
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'bdma-code-signing.pfx'

          if (Test-Path $pfxPath) {
            Remove-Item $pfxPath -Force
          }

          Write-Host 'Code-signing material cleanup completed.'
