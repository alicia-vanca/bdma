name: Build and Release

on:
  push:
    branches:
      - cicd
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download JavaFX JMODs
        run: |
          curl -L "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip" -o javafx-jmods.zip
          Expand-Archive -Path javafx-jmods.zip -DestinationPath C:\
          Rename-Item "C:\javafx-jmods-21.0.2" "C:\javafx-jmods"

      - name: Grant Gradle permission
        run: chmod +x gradlew
        shell: bash

      - name: Build shadow JAR
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
        run: ./gradlew clean shadowJar

      - name: Prepare package folder
        run: |
          mkdir build\package
          copy build\libs\app-*.jar build\package\
          copy src\main\resources\image\logo.ico build\package\

      - name: Build app-image
        env:
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
        run: |
          $version = "${{ env.APP_VERSION }}"
          $modulePath = "$env:JAVA_HOME\jmods;C:\javafx-jmods"

          jpackage `
            --type app-image `
            --name BDMA `
            --input build\package `
            --main-jar app-$version.jar `
            --main-class com.app.MainApp `
            --app-version $version `
            --icon build\package\logo.ico `
            --dest build\dist `
            --module-path "$modulePath" `
            --add-modules "javafx.base,javafx.graphics,javafx.controls,javafx.fxml,java.sql,java.logging" `
            --java-options "-DLOGGLY_TOKEN=$env:LOGGLY_TOKEN" `
            --jlink-options "--strip-debug --compress=2 --no-header-files --no-man-pages --bind-services"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer
        run: |
          $version = "${{ env.APP_VERSION }}"
          $outputDir = Join-Path (Get-Location).Path "build\installer"
          $sourceDir = Join-Path (Get-Location).Path "build\dist\BDMA"
          $iconPath = Join-Path (Get-Location).Path "src\main\resources\image\logo.ico"
          $appPathsSource = Get-Content "src\main\java\com\app\common\definitions\AppDataPaths.java" -Raw
          $appDirMatch = [regex]::Match($appPathsSource, 'APP_DIR\s*=\s*(?:Path\.of\(\s*System\.getProperty\("user\.home"\)\s*,\s*(?<suffixExpression>.*?)\)\.toString\(\)|System\.getProperty\("user\.home"\)\s*\+\s*(?<suffixExpression>.*?));', [System.Text.RegularExpressions.RegexOptions]::Singleline)

          if (-not $appDirMatch.Success) {
            throw "Could not extract APP_DIR from AppDataPaths.java"
          }

          $suffixParts = [regex]::Matches($appDirMatch.Groups['suffixExpression'].Value, '"([^"]*)"') | ForEach-Object {
            $_.Groups[1].Value
          }

          if ($suffixParts.Count -eq 0) {
            throw "Could not extract APP_DIR suffix from AppDataPaths.java"
          }

          $appDataDir = '$PROFILE' + (($suffixParts -join '') -replace '/', '\\')

          New-Item -ItemType Directory -Force -Path build\installer | Out-Null

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /INPUTCHARSET UTF8 `
            "/DAPP_VERSION=$version" `
            "/DINSTALLER_OUTPUT_DIR=$outputDir" `
            "/DINSTALLER_SOURCE_DIR=$sourceDir" `
            "/DINSTALLER_ICON=$iconPath" `
            "/DAPP_DATA_DIR=$appDataDir" `
            src\main\resources\installer\installer.nsi

      # Upload artifact để tải về (chạy trên cả 2 nhánh)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDMA-${{ env.APP_VERSION }}
          path: build/installer/*.exe
          retention-days: 7

      # Tạo Release chỉ khi push vào nhánh cicd
      - name: Upload Release Asset
        if: github.ref == 'refs/heads/cicd'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/installer/*.exe
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}