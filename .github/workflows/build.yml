name: Build and Release

on:
  push:
    branches:
      - develop
      - release

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download JavaFX JMODs
        run: |
          curl -L "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip" -o javafx-jmods.zip
          Expand-Archive -Path javafx-jmods.zip -DestinationPath C:\
          Rename-Item "C:\javafx-jmods-21.0.2" "C:\javafx-jmods"

      - name: Grant Gradle permission
        run: chmod +x gradlew
        shell: bash

      - name: Build shadow JAR
        env:
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
          BODYCAM_CRYPTO_PASSWORD: ${{ secrets.BODYCAM_CRYPTO_PASSWORD }}
          PATCH_MASTER_KEY: ${{ secrets.PATCH_MASTER_KEY }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: ./gradlew clean shadowJar

      - name: Prepare package folder
        run: |
          mkdir build\package
          copy build\libs\app-*.jar build\package\
          copy src\main\resources\image\logo.ico build\package\

      - name: Build app-image
        env:
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
          BODYCAM_CRYPTO_PASSWORD: ${{ secrets.BODYCAM_CRYPTO_PASSWORD }}
          PATCH_MASTER_KEY: ${{ secrets.PATCH_MASTER_KEY }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          APP_UPDATE_GITHUB_TOKEN: ${{ secrets.APP_UPDATE_GITHUB_TOKEN }}
        run: |
          $version = "${{ env.APP_VERSION }}"
          $modulePath = "$env:JAVA_HOME\jmods;C:\javafx-jmods"

          jpackage `
            --type app-image `
            --name BDMA `
            --input build\package `
            --main-jar app-$version.jar `
            --main-class com.app.MainApp `
            --app-version $version `
            --icon build\package\logo.ico `
            --dest build\dist `
            --module-path "$modulePath" `
            --add-modules "javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.media,javafx.web,java.sql,java.logging,java.net.http,jdk.httpserver" `
            --java-options "-DLOGGLY_TOKEN=$env:LOGGLY_TOKEN -DBODYCAM_CRYPTO_PASSWORD=$env:BODYCAM_CRYPTO_PASSWORD -DPATCH_MASTER_KEY=$env:PATCH_MASTER_KEY -DTOTP_SECRET=$env:TOTP_SECRET -DAPP_UPDATE_GITHUB_TOKEN=$env:APP_UPDATE_GITHUB_TOKEN" `
            --jlink-options "--strip-debug --compress=2 --no-header-files --no-man-pages --bind-services"

      - name: Require administrator for app launcher
        run: |
          $launcherPath = [System.IO.Path]::GetFullPath("build\dist\BDMA\BDMA.exe")
          $patchedLauncherPath = Join-Path (Split-Path -Parent $launcherPath) "BDMA.patched.exe"
          $kitsRoot = Get-ItemPropertyValue -LiteralPath "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -Name KitsRoot10
          $mtPath = Get-ChildItem -LiteralPath (Join-Path $kitsRoot "bin") -Filter mt.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mtPath) { throw "Windows SDK mt.exe was not found" }

          $manifestPath = Join-Path $env:RUNNER_TEMP "BDMA-launcher.manifest"
          & $mtPath "-inputresource:$launcherPath;#1" "-out:$manifestPath"
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract BDMA.exe manifest" }

          $utf8Strict = [System.Text.UTF8Encoding]::new($false, $true)
          $manifest = [System.IO.File]::ReadAllText($manifestPath, $utf8Strict)
          $levelPattern = '(?is)(<requestedExecutionLevel\b[^>]*\blevel\s*=\s*)(["''])asInvoker\2'
          $levelRegex = [regex]::new($levelPattern)
          if (-not $levelRegex.IsMatch($manifest)) { throw "BDMA.exe manifest has no asInvoker level" }
          $manifest = $levelRegex.Replace($manifest, '$1$2requireAdministrator$2', 1)
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))

          $launcher = Get-Item -LiteralPath $launcherPath
          $launcher.IsReadOnly = $false
          & $mtPath -manifest $manifestPath "-outputresource:$launcherPath;#1"
          if ($LASTEXITCODE -ne 0) { throw "Failed to embed administrator manifest into BDMA.exe" }
          Remove-Item -LiteralPath $manifestPath -Force
      - name: Install NSIS
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          $maxInstallAttempts = 4
          $installSucceeded = $false

          for ($attempt = 1; $attempt -le $maxInstallAttempts; $attempt++) {
            Write-Host "Installing NSIS (attempt $attempt of $maxInstallAttempts)..."

            choco install nsis -y --no-progress
            $chocoExitCode = $LASTEXITCODE

            if ($chocoExitCode -eq 0 -and (Test-Path $nsisPath)) {
              $installSucceeded = $true
              break
            }

            if ($attempt -lt $maxInstallAttempts) {
              $retryDelaySeconds = [int](5 * [math]::Pow(2, $attempt))
              Write-Warning "NSIS installation attempt $attempt failed with exit code $chocoExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $installSucceeded) {
            throw "NSIS installation failed after $maxInstallAttempts attempts. Expected executable not found: $nsisPath"
          }

          Write-Host "NSIS installation verified: $nsisPath"

      - name: Build NSIS installer
        run: |
          $version = "${{ env.APP_VERSION }}"
          $outputDir = Join-Path (Get-Location).Path "build\installer"
          $sourceDir = Join-Path (Get-Location).Path "build\dist\BDMA"
          $iconPath = Join-Path (Get-Location).Path "src\main\resources\image\logo.ico"
          $appPathsSource = Get-Content "src\main\java\com\app\common\definitions\AppDataPaths.java" -Raw
          $appDirMatch = [regex]::Match($appPathsSource, 'APP_DIR\s*=\s*(?:Path\.of\(\s*System\.getProperty\("user\.home"\)\s*,\s*(?<pathOfSuffixExpression>.*?)\)\s*\.toString\(\)|System\.getProperty\("user\.home"\)\s*\+\s*(?<concatSuffixExpression>.*?));', [System.Text.RegularExpressions.RegexOptions]::Singleline)

          if (-not $appDirMatch.Success) {
            throw "Could not extract APP_DIR from AppDataPaths.java"
          }

          $isPathOfExpression = $appDirMatch.Groups['pathOfSuffixExpression'].Success
          $pathSeparator = [IO.Path]::DirectorySeparatorChar
          $suffixExpression = if ($isPathOfExpression) {
            $appDirMatch.Groups['pathOfSuffixExpression'].Value
          } else {
            $appDirMatch.Groups['concatSuffixExpression'].Value
          }

          $suffixParts = [regex]::Matches($suffixExpression, '"([^"]*)"') | ForEach-Object {
            $_.Groups[1].Value.Replace('/', $pathSeparator)
          }

          if ($suffixParts.Count -eq 0) {
            throw "Could not extract APP_DIR suffix from AppDataPaths.java"
          }

          if ($isPathOfExpression) {
            $appDataDir = '$PROFILE' + $pathSeparator + ($suffixParts -join $pathSeparator)
          } else {
            $appDataDir = '$PROFILE' + ($suffixParts -join '')
          }

          New-Item -ItemType Directory -Force -Path build\installer | Out-Null

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /INPUTCHARSET UTF8 `
            "/DAPP_VERSION=$version" `
            "/DINSTALLER_OUTPUT_DIR=$outputDir" `
            "/DINSTALLER_SOURCE_DIR=$sourceDir" `
            "/DINSTALLER_ICON=$iconPath" `
            "/DAPP_DATA_DIR=$appDataDir" `
            src\main\resources\installer\installer.nsi

      - name: Prepare fixed R2 installer name
        run: |
          New-Item -ItemType Directory -Force -Path build\r2 | Out-Null

          $installer = Get-ChildItem build\installer\*.exe | Select-Object -First 1

          if (-not $installer) {
            throw "No installer .exe found in build\installer"
          }

          if ($env:GITHUB_REF_NAME -eq "develop") {
            Copy-Item $installer.FullName build\r2\BDMA_dev.exe -Force
            Write-Host "Prepared development installer: build\r2\BDMA_dev.exe"
          } elseif ($env:GITHUB_REF_NAME -eq "release") {
            Copy-Item $installer.FullName build\r2\BDMA.exe -Force
            Write-Host "Prepared production installer: build\r2\BDMA.exe"
          } else {
            throw "Unsupported branch: $env:GITHUB_REF_NAME"
          }

      - name: Upload latest installer to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWS_ACCESS_KEY_ID)) {
            throw "Missing GitHub secret: R2_ACCESS_KEY_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:AWS_SECRET_ACCESS_KEY)) {
            throw "Missing GitHub secret: R2_SECRET_ACCESS_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID)) {
            throw "Missing GitHub secret: R2_ACCOUNT_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:R2_BUCKET_NAME)) {
            throw "Missing GitHub secret: R2_BUCKET_NAME"
          }

          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          if ($env:GITHUB_REF_NAME -eq "develop") {
            $localFile = "build\r2\BDMA_dev.exe"
            $objectKey = "BDMA_dev.exe"
          } elseif ($env:GITHUB_REF_NAME -eq "release") {
            $localFile = "build\r2\BDMA.exe"
            $objectKey = "BDMA.exe"
          } else {
            throw "Unsupported branch for R2 upload: $env:GITHUB_REF_NAME"
          }

          if (-not (Test-Path $localFile)) {
            throw "R2 upload file not found: $localFile"
          }

          $localFileLength = (Get-Item $localFile).Length
          $uploadId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_SHA"
          $maxUploadAttempts = 4
          $uploadSucceeded = $false

          for ($attempt = 1; $attempt -le $maxUploadAttempts; $attempt++) {
            Write-Host "Uploading $localFile to R2 object key: $objectKey (attempt $attempt of $maxUploadAttempts)"

            aws s3 cp $localFile "s3://$env:R2_BUCKET_NAME/$objectKey" `
              --endpoint-url $endpoint `
              --content-type "application/vnd.microsoft.portable-executable" `
              --cache-control "no-store, max-age=0, must-revalidate" `
              --metadata "github-upload-id=$uploadId" `
              --no-progress

            $uploadExitCode = $LASTEXITCODE

            if ($uploadExitCode -eq 0) {
              $uploadSucceeded = $true
              break
            }

            if ($attempt -lt $maxUploadAttempts) {
              $retryDelaySeconds = [int][math]::Pow(2, $attempt)
              Write-Warning "R2 upload attempt $attempt failed with exit code $uploadExitCode. Retrying in $retryDelaySeconds seconds..."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $uploadSucceeded) {
            throw "R2 upload failed after $maxUploadAttempts attempts."
          }

          Write-Host "Verifying uploaded object belongs to this workflow run..."

          $headJson = aws s3api head-object `
            --bucket $env:R2_BUCKET_NAME `
            --key $objectKey `
            --endpoint-url $endpoint `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "R2 upload verification request failed."
          }

          $head = $headJson | ConvertFrom-Json
          $remoteUploadId = $head.Metadata.'github-upload-id'

          if ([int64]$head.ContentLength -ne $localFileLength) {
            throw "R2 upload verification failed: remote size $($head.ContentLength) does not match local size $localFileLength."
          }

          if ($remoteUploadId -ne $uploadId) {
            throw "R2 upload verification failed: remote upload ID '$remoteUploadId' does not match this workflow run."
          }

          Write-Host "R2 upload verified successfully ($localFileLength bytes, upload ID $uploadId)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDMA-${{ env.APP_VERSION }}
          path: build/installer/*.exe
          retention-days: 7

      - name: Upload Release Asset
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/installer/*.exe
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
