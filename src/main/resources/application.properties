# ===== SPRING BASIC =====
spring.main.web-application-type=none
spring.main.banner-mode=off

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.app=DEBUG
# Deprecated method used to send logs to Loggly, preserve temporarily
loggly.batch.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true
app.db.encryption.enabled=true
app.storage.protection.enabled=true

# ===== DEVICE VALIDATION =====
device.validation.config-cson-path=/sdcard/DCIM/configs.cson
device.validation.required-device-data-folder=/sdcard/Android/data/com.bodycamera.nettysocket

# ===== BODYCAM CRYPTO =====
# Password used to decrypt _enc media during sync. Prefer BODYCAM_CRYPTO_PASSWORD in production.
bodycam.crypto.password=${BODYCAM_CRYPTO_PASSWORD:123456}
# Temporary startup migration for legacy synced _enc files. Remove after transition phase.
bodycam.crypto.synced-encrypted-transition.enabled=true

# ===== DEV MODE =====
# Default Base32 secret for the temporary dev account. Replace per environment.
app.dev.totp.secret=${TOTP_SECRET:DEFAULTOTPSECRET}
# Dev builds can accept any six-digit OTP for local testing only.
app.dev.totp.accept-any=false

# ===== PATCH ENCRYPTION =====
# Must be a 256-bit AES key encoded as 64 hex digits or Base64.
patch.master.key=${PATCH_MASTER_KEY:CFAC5015881407AF7CC422615869FAFDF87403DDC1F8AC30366A2E8ED64FD9BA}
app.dev-mode=true
